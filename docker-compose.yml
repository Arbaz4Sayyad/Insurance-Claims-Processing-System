version: '3.8'

services:
  # PostgreSQL Instances (Isolated per Service)
  postgres-user:
    image: postgres:15
    container_name: his_postgres_user
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_users"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-ar:
    image: postgres:15
    container_name: his_postgres_ar
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_ar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_ar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-dc:
    image: postgres:15
    container_name: his_postgres_dc
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_dc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_dc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-ed:
    image: postgres:15
    container_name: his_postgres_ed
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_ed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_ed"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-co:
    image: postgres:15
    container_name: his_postgres_co
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_co
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_co"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-bi:
    image: postgres:15
    container_name: his_postgres_bi
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_bi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_bi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  postgres-analytics:
    image: postgres:15
    container_name: his_postgres_analytics
    environment:
      POSTGRES_USER: his_user
      POSTGRES_PASSWORD: his_password
      POSTGRES_DB: his_analytics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U his_user -d his_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - his-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: his_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - his-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: his_kafka
    depends_on:
      - zookeeper
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - his-network

  redis:
    image: redis:alpine
    container_name: his_redis
    ports:
      - "6379:6379"
    networks:
      - his-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: his_zipkin
    ports:
      - "9411:9411"
    networks:
      - his-network

  # Core Infrastructure Services
  config-server:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: config-server
    container_name: config-server
    ports:
      - "18888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config/
    volumes:
      - ./config-server/src/main/resources/config:/app/config
    networks:
      - his-network

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: discovery-server
    container_name: discovery-server
    ports:
      - "18761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_INSTANCE_HOSTNAME=discovery-server
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - his-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: api-gateway
    container_name: api-gateway
    ports:
      - "18080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - his-network

  # Business Services
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: user-service
    container_name: user-service
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/his_users
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
    networks:
      - his-network

  ar-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: ar-service
    container_name: ar-service
    depends_on:
      postgres-ar:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ar:5432/his_ar
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - AR_ENCRYPTION_SECRET=3c5fG9H1j2K3l4N5p6Q7r8S9t0U1v2W3
    networks:
      - his-network

  dc-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: dc-service
    container_name: dc-service
    depends_on:
      postgres-dc:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-dc:5432/his_dc
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - DC_VALIDATION_CLIENT_URL=http://api-gateway:8080
    networks:
      - his-network

  ed-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: ed-service
    container_name: ed-service
    depends_on:
      postgres-ed:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ed:5432/his_ed
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - ED_CLIENT_AR_URL=http://api-gateway:8080
      - ED_CLIENT_DC_URL=http://api-gateway:8080
    networks:
      - his-network

  co-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: co-service
    container_name: co-service
    depends_on:
      postgres-co:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-co:5432/his_co
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    networks:
      - his-network

  bi-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: bi-service
    container_name: bi-service
    depends_on:
      postgres-bi:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-bi:5432/his_bi
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    networks:
      - his-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: analytics-service
    container_name: analytics-service
    depends_on:
      postgres-analytics:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-analytics:5432/his_analytics
      - SPRING_DATASOURCE_USERNAME=his_user
      - SPRING_DATASOURCE_PASSWORD=his_password
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
    networks:
      - his-network

  dashboard-aggregator:
    build:
      context: .
      dockerfile: Dockerfile.module
      args:
        MODULE: dashboard-aggregator
    container_name: dashboard-aggregator
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    networks:
      - his-network

  frontend:
    build:
      context: ./iecs-frontend
    container_name: frontend
    ports:
      - "18081:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - his-network

networks:
  his-network:
    driver: bridge

volumes:
  postgres_user_data:
  postgres_ar_data:
  postgres_dc_data:
  postgres_ed_data:
  postgres_co_data:
  postgres_bi_data:
  postgres_analytics_data:
